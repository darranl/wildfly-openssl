name: CI - LTS Nightly (Full Matrix)

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-test:
    name: Build and Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            vcvars: C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvars64.bat
            openssl_home: C:\Program Files\OpenSSL-Win64
    
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Install all required JDKs and capture their paths
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Capture JDK 17 (Temurin) path
        shell: bash
        run: echo "JAVA_HOME_17_TEMURIN=$JAVA_HOME" >> $GITHUB_ENV
      
      - name: Set up JDK 17 (Semeru)
        uses: actions/setup-java@v4
        with:
          distribution: 'semeru'
          java-version: '17'
      
      - name: Capture JDK 17 (Semeru) path
        shell: bash
        run: echo "JAVA_HOME_17_SEMERU=$JAVA_HOME" >> $GITHUB_ENV
      
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Capture JDK 21 (Temurin) path
        shell: bash
        run: echo "JAVA_HOME_21_TEMURIN=$JAVA_HOME" >> $GITHUB_ENV
      
      - name: Set up JDK 21 (Semeru)
        uses: actions/setup-java@v4
        with:
          distribution: 'semeru'
          java-version: '21'
      
      - name: Capture JDK 21 (Semeru) path
        shell: bash
        run: echo "JAVA_HOME_21_SEMERU=$JAVA_HOME" >> $GITHUB_ENV
      
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      
      - name: Capture JDK 25 (Temurin) path
        shell: bash
        run: echo "JAVA_HOME_25_TEMURIN=$JAVA_HOME" >> $GITHUB_ENV
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Set up JDK 25 (Semeru)
        uses: actions/setup-java@v4
        with:
          distribution: 'semeru'
          java-version: '25'
      
      - name: Capture JDK 25 (Semeru) path
        shell: bash
        run: echo "JAVA_HOME_25_SEMERU=$JAVA_HOME" >> $GITHUB_ENV
      
      # 3. Platform-specific OpenSSL setup
      - name: OpenSSL Library Version Info (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: openssl version -v
      
      - name: OpenSSL Library Version Info (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          export PATH="/usr/local/opt/openssl@3/bin:$PATH"
          openssl version
      
      - name: Install OpenSSL 3 on Windows
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static-md
      
      # 4. Generate toolchains.xml
      - name: Generate toolchains.xml
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/TOOLCHAINS/1.1.0
                                          http://maven.apache.org/xsd/toolchains-1.1.0.xsd">
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_17_TEMURIN}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
                <vendor>semeru</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_17_SEMERU}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
                <vendor>temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_21_TEMURIN}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
                <vendor>semeru</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_21_SEMERU}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
                <vendor>temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_25_TEMURIN}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
                <vendor>semeru</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_25_SEMERU}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF
      
      # 5. Build once with Java 25 (platform-specific)
      - name: Build with Java 25 (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          export JAVA_HOME="${JAVA_HOME_25_TEMURIN}"
          mvn clean install -DskipTests -B -V -Dorg.wildfly.openssl.path=/usr/lib/x86_64-linux-gnu
      
      - name: Build with Java 25 (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          export JAVA_HOME="${JAVA_HOME_25_TEMURIN}"
          export PATH="/usr/local/opt/openssl@3/bin:$PATH"
          mvn clean install -DskipTests -B -V -Dorg.wildfly.openssl.path="/usr/local/opt/openssl@3/lib"
      
      - name: Build with Java 25 (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VCVARS: ${{ matrix.vcvars }}
          OPENSSL_HOME: ${{ matrix.openssl_home }}
        shell: cmd
        run: |
          call "%VCVARS%" x64
          set PATH=C:\vcpkg\installed\x64-windows\tools\openssl;%PATH%
          set JAVA_HOME=%JAVA_HOME_25_TEMURIN%
          mvn clean install -DskipTests -B -V
      
      # 6. Run tests with Java 17 (Temurin)
      - name: Test with Java 17 (Temurin) - Linux
        if: matrix.os == 'ubuntu-latest'
        id: test-java17-temurin
        shell: bash
        timeout-minutes: 30
        run: |
          mvn test -Djdk.test.version=17 -Djdk.test.vendor=temurin -B -Dorg.wildfly.openssl.path=/usr/lib/x86_64-linux-gnu
        continue-on-error: true
      
      - name: Test with Java 17 (Temurin) - macOS
        if: matrix.os == 'macos-latest'
        id: test-java17-temurin
        shell: bash
        timeout-minutes: 30
        run: |
          export PATH="/usr/local/opt/openssl@3/bin:$PATH"
          mvn test -Djdk.test.version=17 -Djdk.test.vendor=temurin -B -Dorg.wildfly.openssl.path="/usr/local/opt/openssl@3/lib"
        continue-on-error: true
      
      - name: Test with Java 17 (Temurin) - Windows
        if: matrix.os == 'windows-latest'
        id: test-java17-temurin
        env:
          VCVARS: ${{ matrix.vcvars }}
        shell: cmd
        timeout-minutes: 30
        run: |
          call "%VCVARS%" x64
          set PATH=C:\vcpkg\installed\x64-windows\tools\openssl;%PATH%
          mvn test -Djdk.test.version=17 -Djdk.test.vendor=temurin -B
        continue-on-error: true
      
      - name: Publish test results - Java 17 (Temurin) - ${{ matrix.os }}
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'Test Results - Java 17 (Temurin) - ${{ matrix.os }}'
          comment_mode: off
      
      - name: Upload test results - Java 17 (Temurin) - ${{ matrix.os }}
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java17-temurin-${{ matrix.os }}
          path: '**/target/surefire-reports/**'
          retention-days: 30
      
      # 7. Run tests with Java 17 (Semeru)
      - name: Test with Java 17 (Semeru) - Linux
        if: matrix.os == 'ubuntu-latest'
        id: test-java17-semeru
        shell: bash
        timeout-minutes: 30
        run: |
          mvn test -Djdk.test.version=17 -Djdk.test.vendor=semeru -B -Dorg.wildfly.openssl.path=/usr/lib/x86_64-linux-gnu
        continue-on-error: true
      
      - name: Test with Java 17 (Semeru) - macOS
        if: matrix.os == 'macos-latest'
        id: test-java17-semeru
        shell: bash
        timeout-minutes: 30
        run: |
          export PATH="/usr/local/opt/openssl@3/bin:$PATH"
          mvn test -Djdk.test.version=17 -Djdk.test.vendor=semeru -B -Dorg.wildfly.openssl.path="/usr/local/opt/openssl@3/lib"
        continue-on-error: true
      
      - name: Test with Java 17 (Semeru) - Windows
        if: matrix.os == 'windows-latest'
        id: test-java17-semeru
        env:
          VCVARS: ${{ matrix.vcvars }}
        shell: cmd
        timeout-minutes: 30
        run: |
          call "%VCVARS%" x64
          set PATH=C:\vcpkg\installed\x64-windows\tools\openssl;%PATH%
          mvn test -Djdk.test.version=17 -Djdk.test.vendor=semeru -B
        continue-on-error: true
      
      - name: Publish test results - Java 17 (Semeru) - ${{ matrix.os }}
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'Test Results - Java 17 (Semeru) - ${{ matrix.os }}'
          comment_mode: off
      
      - name: Upload test results - Java 17 (Semeru) - ${{ matrix.os }}
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java17-semeru-${{ matrix.os }}
          path: '**/target/surefire-reports/**'
          retention-days: 30
      
      # 8. Run tests with Java 21 (Temurin)
      - name: Test with Java 21 (Temurin) - Linux
        if: matrix.os == 'ubuntu-latest'
        id: test-java21-temurin
        shell: bash
        timeout-minutes: 30
        run: |
          mvn test -Djdk.test.version=21 -Djdk.test.vendor=temurin -B -Dorg.wildfly.openssl.path=/usr/lib/x86_64-linux-gnu
        continue-on-error: true
      
      - name: Test with Java 21 (Temurin) - macOS
        if: matrix.os == 'macos-latest'
        id: test-java21-temurin
        shell: bash
        timeout-minutes: 30
        run: |
          export PATH="/usr/local/opt/openssl@3/bin:$PATH"
          mvn test -Djdk.test.version=21 -Djdk.test.vendor=temurin -B -Dorg.wildfly.openssl.path="/usr/local/opt/openssl@3/lib"
        continue-on-error: true
      
      - name: Test with Java 21 (Temurin) - Windows
        if: matrix.os == 'windows-latest'
        id: test-java21-temurin
        env:
          VCVARS: ${{ matrix.vcvars }}
        shell: cmd
        timeout-minutes: 30
        run: |
          call "%VCVARS%" x64
          set PATH=C:\vcpkg\installed\x64-windows\tools\openssl;%PATH%
          mvn test -Djdk.test.version=21 -Djdk.test.vendor=temurin -B
        continue-on-error: true
      
      - name: Publish test results - Java 21 (Temurin) - ${{ matrix.os }}
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'Test Results - Java 21 (Temurin) - ${{ matrix.os }}'
          comment_mode: off
      
      - name: Upload test results - Java 21 (Temurin) - ${{ matrix.os }}
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java21-temurin-${{ matrix.os }}
          path: '**/target/surefire-reports/**'
          retention-days: 30
      
      # 9. Run tests with Java 21 (Semeru)
      - name: Test with Java 21 (Semeru) - Linux
        if: matrix.os == 'ubuntu-latest'
        id: test-java21-semeru
        shell: bash
        timeout-minutes: 30
        run: |
          mvn test -Djdk.test.version=21 -Djdk.test.vendor=semeru -B -Dorg.wildfly.openssl.path=/usr/lib/x86_64-linux-gnu
        continue-on-error: true
      
      - name: Test with Java 21 (Semeru) - macOS
        if: matrix.os == 'macos-latest'
        id: test-java21-semeru
        shell: bash
        timeout-minutes: 30
        run: |
          export PATH="/usr/local/opt/openssl@3/bin:$PATH"
          mvn test -Djdk.test.version=21 -Djdk.test.vendor=semeru -B -Dorg.wildfly.openssl.path="/usr/local/opt/openssl@3/lib"
        continue-on-error: true
      
      - name: Test with Java 21 (Semeru) - Windows
        if: matrix.os == 'windows-latest'
        id: test-java21-semeru
        env:
          VCVARS: ${{ matrix.vcvars }}
        shell: cmd
        timeout-minutes: 30
        run: |
          call "%VCVARS%" x64
          set PATH=C:\vcpkg\installed\x64-windows\tools\openssl;%PATH%
          mvn test -Djdk.test.version=21 -Djdk.test.vendor=semeru -B
        continue-on-error: true
      
      - name: Publish test results - Java 21 (Semeru) - ${{ matrix.os }}
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'Test Results - Java 21 (Semeru) - ${{ matrix.os }}'
          comment_mode: off
      
      - name: Upload test results - Java 21 (Semeru) - ${{ matrix.os }}
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java21-semeru-${{ matrix.os }}
          path: '**/target/surefire-reports/**'
          retention-days: 30
      
      # 10. Run tests with Java 25 (Temurin)
      - name: Test with Java 25 (Temurin) - Linux
        if: matrix.os == 'ubuntu-latest'
        id: test-java25-temurin
        shell: bash
        timeout-minutes: 30
        run: |
          mvn test -Djdk.test.version=25 -Djdk.test.vendor=temurin -B -Dorg.wildfly.openssl.path=/usr/lib/x86_64-linux-gnu
        continue-on-error: true
      
      - name: Test with Java 25 (Temurin) - macOS
        if: matrix.os == 'macos-latest'
        id: test-java25-temurin
        shell: bash
        timeout-minutes: 30
        run: |
          export PATH="/usr/local/opt/openssl@3/bin:$PATH"
          mvn test -Djdk.test.version=25 -Djdk.test.vendor=temurin -B -Dorg.wildfly.openssl.path="/usr/local/opt/openssl@3/lib"
        continue-on-error: true
      
      - name: Test with Java 25 (Temurin) - Windows
        if: matrix.os == 'windows-latest'
        id: test-java25-temurin
        env:
          VCVARS: ${{ matrix.vcvars }}
        shell: cmd
        timeout-minutes: 30
        run: |
          call "%VCVARS%" x64
          set PATH=C:\vcpkg\installed\x64-windows\tools\openssl;%PATH%
          mvn test -Djdk.test.version=25 -Djdk.test.vendor=temurin -B
        continue-on-error: true
      
      - name: Publish test results - Java 25 (Temurin) - ${{ matrix.os }}
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'Test Results - Java 25 (Temurin) - ${{ matrix.os }}'
          comment_mode: off
      
      - name: Upload test results - Java 25 (Temurin) - ${{ matrix.os }}
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java25-temurin-${{ matrix.os }}
          path: '**/target/surefire-reports/**'
          retention-days: 30
      
      # 11. Run tests with Java 25 (Semeru)
      - name: Test with Java 25 (Semeru) - Linux
        if: matrix.os == 'ubuntu-latest'
        id: test-java25-semeru
        shell: bash
        timeout-minutes: 30
        run: |
          mvn test -Djdk.test.version=25 -Djdk.test.vendor=semeru -B -Dorg.wildfly.openssl.path=/usr/lib/x86_64-linux-gnu
        continue-on-error: true
      
      - name: Test with Java 25 (Semeru) - macOS
        if: matrix.os == 'macos-latest'
        id: test-java25-semeru
        shell: bash
        timeout-minutes: 30
        run: |
          export PATH="/usr/local/opt/openssl@3/bin:$PATH"
          mvn test -Djdk.test.version=25 -Djdk.test.vendor=semeru -B -Dorg.wildfly.openssl.path="/usr/local/opt/openssl@3/lib"
        continue-on-error: true
      
      - name: Test with Java 25 (Semeru) - Windows
        if: matrix.os == 'windows-latest'
        id: test-java25-semeru
        env:
          VCVARS: ${{ matrix.vcvars }}
        shell: cmd
        timeout-minutes: 30
        run: |
          call "%VCVARS%" x64
          set PATH=C:\vcpkg\installed\x64-windows\tools\openssl;%PATH%
          mvn test -Djdk.test.version=25 -Djdk.test.vendor=semeru -B
        continue-on-error: true
      
      - name: Publish test results - Java 25 (Semeru) - ${{ matrix.os }}
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'Test Results - Java 25 (Semeru) - ${{ matrix.os }}'
          comment_mode: off
      
      - name: Upload test results - Java 25 (Semeru) - ${{ matrix.os }}
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java25-semeru-${{ matrix.os }}
          path: '**/target/surefire-reports/**'
          retention-days: 30
      
      # 12. Check for test failures and fail job if any occurred
      - name: Check test results
        if: always()
        shell: bash
        run: |
          echo "Checking test results from all permutations..."
          FAILED=0
          
          if [ "${{ steps.test-java17-temurin.outcome }}" != "success" ]; then
            echo "❌ Java 17 (Temurin) tests failed"
            FAILED=1
          fi
          
          if [ "${{ steps.test-java17-semeru.outcome }}" != "success" ]; then
            echo "❌ Java 17 (Semeru) tests failed"
            FAILED=1
          fi
          
          if [ "${{ steps.test-java21-temurin.outcome }}" != "success" ]; then
            echo "❌ Java 21 (Temurin) tests failed"
            FAILED=1
          fi
          
          if [ "${{ steps.test-java21-semeru.outcome }}" != "success" ]; then
            echo "❌ Java 21 (Semeru) tests failed"
            FAILED=1
          fi
          
          if [ "${{ steps.test-java25-temurin.outcome }}" != "success" ]; then
            echo "❌ Java 25 (Temurin) tests failed"
            FAILED=1
          fi
          
          if [ "${{ steps.test-java25-semeru.outcome }}" != "success" ]; then
            echo "❌ Java 25 (Semeru) tests failed"
            FAILED=1
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "One or more test permutations failed. Check the test result artifacts and logs above."
            exit 1
          else
            echo "✅ All test permutations passed"
          fi
